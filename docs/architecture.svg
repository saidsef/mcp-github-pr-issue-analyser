  <text class="t" x="128" y="829" fill="#1f2328" font-size="14" font-weight="600">REST v3</text>
  <text class="l" x="104" y="854" fill="#24292f" font-size="11.5">PRs: diff, content, comments, reviews</text>
  <text class="l" x="104" y="872" fill="#24292f" font-size="11.5">PRs: create, update, merge, assign</text>
  <text class="l" x="104" y="890" fill="#24292f" font-size="11.5">Issues, labels, tags, releases</text>

  <rect class="box" x="426" y="800" width="330" height="112" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <g transform="translate(446,816)">
    <path class="ic" d="M8 1.6 L13.5 4.8 V11.2 L8 14.4 L2.5 11.2 V4.8 Z" fill="none" stroke="#1f2328" stroke-width="1.3" stroke-linejoin="round"/>
