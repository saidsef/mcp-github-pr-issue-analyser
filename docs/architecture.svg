<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-labelledby="svgtitle svgdesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="svgtitle">MCP GitHub PR and Issue Analyser architecture</title>
  <desc id="svgdesc">An MCP client connects over stdio or HTTP POST to /mcp. The auth layer in auth.py selects no auth for stdio, an APIKeyVerifier that compares the bearer token against GITHUB_TOKEN, or a GitHubProvider that proxies the GitHub OAuth2 authorisation code flow and stores tokens in memory, in DynamoDB or in Redis. Authenticated calls reach the PRIssueAnalyser FastMCP server, which registers the tools and skills, exposes Prometheus metrics on GET /metrics, and calls the GitHub integration. The integration resolves a token per call and reaches api.github.com over the REST v3 and GraphQL v4 APIs.</desc>

  <!-- The light palette is set with presentation attributes so the diagram still renders
       if a strict CSP drops this block. Dark mode overrides only the colours. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .box     { fill: #161b22; stroke: #4b535d; }
      .boxdash { stroke: #768390; }
      .div     { stroke: #30363d; }
      .edge    { stroke: #768390; }
      .ah      { fill: #768390; }
      .t       { fill: #e6edf3; }
      .l       { fill: #c9d1d9; }
      .s       { fill: #9198a1; }
      .ic      { stroke: #c9d1d9; }
      .icf     { fill: #c9d1d9; }
      .gh      { fill: #e6edf3; }
      .o-s     { stroke: #f0883e; }
      .o-f     { fill: #f0883e; }
      .r-s     { stroke: #f85149; }
      .r-f     { fill: #f85149; }
      .b-s     { stroke: #58a6ff; }
      .b-f     { fill: #58a6ff; }
    }
  </style>

