  <text class="s" x="272" y="317" fill="#656d76" font-size="11.5">constant-time compare against GITHUB_TOKEN</text>

  <g class="ic" transform="translate(246,329)" fill="none" stroke="#1f2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
