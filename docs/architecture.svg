  <!-- ===================== GitHub integration ===================== -->
  <path class="edge" d="M420 560 V604" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arw)"/>
  <text class="l" x="434" y="580" fill="#24292f" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolve_token()</tspan> per call</text>
  <text class="s" x="434" y="595" fill="#656d76" font-size="11.5">server PAT, or the caller's own token</text>

