---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-github
  labels:
    app.kubernetes.net/name: mcp-github
automountServiceAccountToken: true
# enforce-mountable-secrets, set in kustomization.yml, only lets a pod use
# secrets named here. Without this list no pod is admitted at all. See #328.
secrets:
  - name: github-token
  - name: redis-config
